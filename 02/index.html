<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Instrument · issue 02</title>
  <meta name="description" content="16:03 virga" />
  <meta property="og:title" content="Sky Instrument · issue 02" />
  <meta property="og:description" content="16:03 virga" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://sky-instrument.vercel.app/og-virga.jpg" />
  <style>
    :root { --paper: #f3f1ec; --ink: #161616; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--paper); color: var(--ink); }
    body {
      font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 28px 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    .mark { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
    .sub, .issues { font-size: 11px; letter-spacing: 0.04em; opacity: 0.55; }
    .issues a { color: inherit; text-decoration: none; }
    .issues a[aria-current] { opacity: 1; }
    main { display: grid; grid-template-columns: 1fr; }
    article { display: flex; flex-direction: column; }
    .sky { aspect-ratio: 3 / 4; width: 100%; object-fit: cover; display: block; background: #ddd; }
    figcaption {
      background: var(--paper);
      padding: 18px 24px 22px;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    figcaption .word { letter-spacing: 0.08em; }
    footer { padding: 28px 24px 40px; display: flex; justify-content: space-between; gap: 16px; }
  </style>
</head>
<body>
  <header>
    <a class="mark" href="/" style="color:inherit;text-decoration:none">Sky Instrument</a>
    <div class="sub">issue 02 · virga</div>
  </header>
  <main>
    <article>
      <img class="sky" src="/virga.jpg" alt="Afternoon virga sky" />
      <figcaption>16:03 <span class="word">virga</span></figcaption>
    </article>
  </main>
  <footer>
    <div>what the air is doing · no forecast</div>
    <div class="issues"><a href="/01">01</a> · <a href="/02" aria-current="page">02</a></div>
  </footer>
</body>
</html>
