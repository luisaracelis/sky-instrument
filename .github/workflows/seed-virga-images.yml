name: seed-virga-images
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seed-virga-images.yml"
      - "virga.jpg.b64.part00"
      - "og-virga.jpg.b64.part00"
jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, glob
          root = pathlib.Path(".")
          def join(prefix):
              parts = sorted(root.glob(prefix + ".part*"))
              assert parts, prefix
              return "".join(p.read_text() for p in parts)
          for prefix, dst in [("virga.jpg.b64","virga.jpg"),("og-virga.jpg.b64","og-virga.jpg")]:
              data = base64.b64decode(join(prefix).encode("ascii"))
              assert data[:2] == b"\xff\xd8", dst
              root.joinpath(dst).write_bytes(data)
              print("wrote", dst, len(data))
          PY
          git config user.name "sky-instrument-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virga.jpg og-virga.jpg
          git rm -f --ignore-unmatch test-tiny-b64.jpg test-tiny-enc.jpg \
            virga.jpg.b64 og-virga.jpg.b64 \
            virga.jpg.b64.part00 virga.jpg.b64.part01 virga.jpg.b64.part02 virga.jpg.b64.part03 \
            og-virga.jpg.b64.part00 og-virga.jpg.b64.part01 og-virga.jpg.b64.part02 \
            .github/workflows/seed-virga-images.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Issue 02: virga images"
          git push
